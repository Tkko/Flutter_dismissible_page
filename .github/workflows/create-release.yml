name: Create Release & Tag

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v7.0.1). Leave empty to use version from pubspec.yaml'
        required: false
        type: string
      dry_run:
        description: 'Dry run (validate tests and pubspec without creating tag/release)'
        required: false
        default: false
        type: boolean
      include-windows:
        description: 'Also validate Windows before creating the release'
        required: false
        default: false
        type: boolean

jobs:
  release:
    uses: Tkko/Flutter_Pinput/.github/workflows/create-release.yml@master
    with:
      tag_name: ${{ inputs.tag_name }}
      dry_run: ${{ inputs.dry_run }}
      include-windows: ${{ inputs.include-windows }}
      integration-test-target: integration_test/dismissible_flow_test.dart
    permissions:
      contents: write
      actions: write
