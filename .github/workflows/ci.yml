name: CI

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      full-matrix:
        description: 'Also run Android, iOS, and macOS integration tests'
        type: boolean
        default: true
      include-windows:
        description: 'Also run Windows integration tests'
        type: boolean
        default: false

jobs:
  ci:
    uses: Tkko/better-actions/.github/workflows/ci.yml@ddf7928512e456918edc559fe00502d073d162ee
    with:
      full-matrix: ${{ inputs.full-matrix || false }}
      include-windows: ${{ inputs.include-windows || false }}
      integration-test-target: integration_test/dismissible_flow_test.dart
    permissions:
      contents: read
      pull-requests: read
