name: CI

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Comma-separated integration test platforms: web, linux, android, ios, macos, windows'
        type: string
        default: 'web,linux,android,ios,macos'

jobs:
  ci:
    uses: Tkko/better-actions/.github/workflows/ci.yml@main
    with:
      platforms: ${{ inputs.platforms || 'web,linux' }}
      integration-test-target: integration_test/dismissible_flow_test.dart
    permissions:
      contents: read
      pull-requests: read
